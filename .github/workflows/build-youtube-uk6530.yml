name: Build YouTube UK6530 Optimized

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "youtube-uk6530-optimized/tools/**"
      - ".github/workflows/build-youtube-uk6530.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout PMCN project
        uses: actions/checkout@v4
        with:
          path: project

      - name: Checkout pinned upstream
        uses: actions/checkout@v4
        with:
          repository: NicholasBly/youtube-webos
          ref: 5f7aa18fa0829b4e0607475222d5adacd85c6eff
          path: upstream

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: upstream/package-lock.json

      - name: Apply LG UK6530 v0.3.2 profile
        working-directory: upstream
        run: python3 ../project/youtube-uk6530-optimized/tools/apply_uk6530_patch.py

      - name: Verify v0.3.2 adaptive card sync
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          grep -F "import './pmcn-card-sync.js';" src/userScript.js
          grep -F "pmcn-subscriptions-card-width-v1" src/pmcn-card-sync.js
          grep -F "offsetWidth" src/pmcn-card-sync.js
          grep -F "fesubscriptions" src/pmcn-card-sync.js
          grep -F "fewhat_to_watch" src/pmcn-card-sync.js
          ! grep -F "width: 18rem !important" src/yt-fixes.css
          ! grep -F "import './ui.js';" src/userScript.js
          ! grep -F "import './sponsorblock.js';" src/userScript.js

      - name: Install dependencies
        working-directory: upstream
        run: npm ci

      - name: Build legacy webOS package
        working-directory: upstream
        run: |
          npm run build
          npm run package

      - name: Prepare IPK artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          IPK="$(find upstream/dist -maxdepth 1 -type f -name 'youtube.leanback.v4_0.8.8*.ipk' | head -n 1)"
          test -n "$IPK"
          cp "$IPK" output/YouTube-UK6530-Lite-v0.3.2.ipk
          sha256sum output/YouTube-UK6530-Lite-v0.3.2.ipk | tee output/SHA256SUMS.txt

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: youtube-uk6530-lite-v0.3.2
          path: output/
          if-no-files-found: error
          retention-days: 30

      - name: Publish persistent beta release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="youtube-uk6530-v0.3.2"
          IPK="output/YouTube-UK6530-Lite-v0.3.2.ipk"
          SUMS="output/SHA256SUMS.txt"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPK" "$SUMS" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$IPK" "$SUMS" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "YouTube UK6530 Lite v0.3.2" \
              --prerelease \
              --notes "Layout adaptativo: mede a largura real dos cards da aba Inscrições na própria TV e usa exatamente essa largura na aba Início. Sem dimensão fixa inventada."
          fi
