name: Build YouTube UK6530 Optimized

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "youtube-uk6530-optimized/tools/**"
      - ".github/workflows/build-youtube-uk6530.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout PMCN project
        uses: actions/checkout@v4
        with:
          path: project

      - name: Checkout pinned upstream
        uses: actions/checkout@v4
        with:
          repository: NicholasBly/youtube-webos
          ref: 5f7aa18fa0829b4e0607475222d5adacd85c6eff
          path: upstream

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: upstream/package-lock.json

      - name: Apply LG UK6530 Lite profile
        working-directory: upstream
        run: python3 ../project/youtube-uk6530-optimized/tools/apply_uk6530_patch.py

      - name: Verify Lite cuts
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          grep -F "const UK6530_LITE_PROFILE" src/config.js
          grep -F "forcePreviews: 'force_off'" src/config.js
          grep -F "UK6530_BLOCKED_NAV_TITLES" src/adblock.js
          grep -F "PMCN UK6530 Lite v2" src/yt-fixes.css
          ! grep -F "import './ui.js';" src/userScript.js
          ! grep -F "import './sponsorblock.js';" src/userScript.js
          ! grep -F "import './emoji-font.js';" src/userScript.js
          ! grep -F "import './watch.js';" src/userScript.js
          ! grep -F "thumbnailHookRequired" src/adblock.js

      - name: Install dependencies
        working-directory: upstream
        run: npm ci

      - name: Build legacy webOS package
        working-directory: upstream
        run: |
          npm run build
          npm run package

      - name: Prepare IPK artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          IPK="$(find upstream/dist -maxdepth 1 -type f -name 'youtube.leanback.v4_0.8.5*.ipk' | head -n 1)"
          test -n "$IPK"
          cp "$IPK" output/YouTube-UK6530-Lite-v0.2.0.ipk
          sha256sum output/YouTube-UK6530-Lite-v0.2.0.ipk | tee output/SHA256SUMS.txt

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: youtube-uk6530-lite-v0.2.0
          path: output/
          if-no-files-found: error
          retention-days: 30

      - name: Publish persistent beta release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="youtube-uk6530-v0.2.0"
          IPK="output/YouTube-UK6530-Lite-v0.2.0.ipk"
          SUMS="output/SHA256SUMS.txt"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPK" "$SUMS" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$IPK" "$SUMS" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "YouTube UK6530 Lite v0.2.0" \
              --prerelease \
              --notes "Build Lite agressiva para LG UK6530PSF/webOS 4: adblock fixo, UI/shortcuts/SponsorBlock/RYD/emoji/clock/thumbnail-HD fora do bundle, previews desligados, AV1 evitado, categorias extras removidas antes da renderização e transições de navegação zeradas."
          fi
