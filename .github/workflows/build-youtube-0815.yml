name: Build YouTube UK6530 0.8.15

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-youtube-0815.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout PMCN project
        uses: actions/checkout@v4
        with:
          path: project

      - name: Checkout pinned upstream
        uses: actions/checkout@v4
        with:
          repository: NicholasBly/youtube-webos
          ref: 5f7aa18fa0829b4e0607475222d5adacd85c6eff
          path: upstream

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: upstream/package-lock.json

      - name: Apply approved 0.8.8 base
        working-directory: upstream
        run: python3 ../project/youtube-uk6530-optimized/tools/apply_uk6530_patch.py

      - name: Apply 0.8.14 menu fixes
        working-directory: upstream
        run: python3 ../project/youtube-uk6530-optimized/tools/apply_uk6530_0814_delta.py

      - name: Apply 0.8.15 thumbnail selector
        working-directory: upstream
        run: python3 ../project/youtube-uk6530-optimized/tools/apply_uk6530_0815_delta.py

      - name: Generate original YouTube launcher and Recents assets
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow

          # Preserve the original YouTube launcher art, with stable cache-busting
          # filenames already known to work on the user's TV.
          cp assets/icon.png assets/icon_youtube_original_0814.png
          cp assets/largeIcon.png assets/largeIcon_youtube_original_0814.png

          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import json
          from collections import deque

          A = Path("assets")
          src = Image.open(A / "largeIcon.png").convert("RGBA")
          p = src.load()
          w,h = src.size

          seen=set(); q=deque()
          def white(x,y):
              r,g,b,a=p[x,y]
              return a>0 and r>=225 and g>=225 and b>=225

          for x in range(w):
              for y in (0,h-1):
                  if white(x,y): q.append((x,y)); seen.add((x,y))
          for y in range(h):
              for x in (0,w-1):
                  if white(x,y) and (x,y) not in seen:
                      q.append((x,y)); seen.add((x,y))

          while q:
              x,y=q.popleft()
              for nx,ny in ((x-1,y),(x+1,y),(x,y-1),(x,y+1)):
                  if 0<=nx<w and 0<=ny<h and (nx,ny) not in seen and white(nx,ny):
                      seen.add((nx,ny)); q.append((nx,ny))

          logo=src.copy(); lp=logo.load()
          for x,y in seen:
              r,g,b,a=lp[x,y]; lp[x,y]=(r,g,b,0)
          bbox=logo.getchannel("A").getbbox()
          if not bbox:
              raise RuntimeError("Could not isolate original YouTube logo")
          logo=logo.crop(bbox)

          W,H=1920,1080
          rec=Image.new("RGBA",(W,H),(255,255,255,255))
          rw=1050
          rh=round(logo.height*rw/logo.width)
          logo=logo.resize((rw,rh),Image.Resampling.LANCZOS)
          rec.alpha_composite(logo,((W-rw)//2,(H-rh)//2))
          rec.convert("RGB").save(A/"imageForRecents_youtube_original_0814.png",optimize=True)

          app=A/"appinfo.json"
          obj=json.loads(app.read_text(encoding="utf-8"))
          assert obj["version"]=="0.8.15"
          obj["icon"]="icon_youtube_original_0814.png"
          obj["largeIcon"]="largeIcon_youtube_original_0814.png"
          obj["imageForRecents"]="imageForRecents_youtube_original_0814.png"
          obj.pop("splashBackground",None)
          app.write_text(json.dumps(obj,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Verify feature and visual scope
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          grep -F "rewriteThumbnailQuality(data);" src/adblock.js
          grep -F "ColorF3Blue" src/pmcn-thumbnail-quality.js
          grep -F "Nativo (YouTube)" src/pmcn-thumbnail-quality.js
          grep -F "120×90" src/pmcn-thumbnail-quality.js
          grep -F "320×180" src/pmcn-thumbnail-quality.js
          grep -F "480×360" src/pmcn-thumbnail-quality.js
          grep -F "640×480" src/pmcn-thumbnail-quality.js
          grep -F "1280×720" src/pmcn-thumbnail-quality.js
          grep -F "maxresdefault" src/pmcn-thumbnail-quality.js
          grep -F "UK6530_BLOCKED_NAV_BROWSE_IDS" src/adblock.js
          grep -F '"version": "0.8.15"' assets/appinfo.json
          grep -F '"icon": "icon_youtube_original_0814.png"' assets/appinfo.json
          grep -F '"imageForRecents": "imageForRecents_youtube_original_0814.png"' assets/appinfo.json
          ! grep -F '"splashBackground"' assets/appinfo.json

      - name: Install dependencies
        working-directory: upstream
        run: npm ci

      - name: Build package
        working-directory: upstream
        run: |
          npm run build
          npm run package

      - name: Prepare release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          IPK="$(find upstream/dist -maxdepth 1 -type f -name 'youtube.leanback.v4_0.8.15*.ipk' | head -n 1)"
          test -n "$IPK"
          cp "$IPK" output/YouTube-UK6530-Lite-v0.8.15.ipk
          sha256sum output/YouTube-UK6530-Lite-v0.8.15.ipk | tee output/SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="youtube-uk6530-v0.3.5"
          IPK="output/YouTube-UK6530-Lite-v0.8.15.ipk"
          SUMS="output/SHA256SUMS.txt"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPK" "$SUMS" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$IPK" "$SUMS"               --repo "$GITHUB_REPOSITORY"               --target "$GITHUB_SHA"               --title "YouTube UK6530 0.8.15"               --prerelease               --notes "Base 0.8.8 aprovada + correção estrutural do menu da 0.8.14. Novo menu de qualidade das capas pelo botão azul: Nativo, 120x90, 320x180, 480x360, 640x480, 1280x720 e Máxima. Escolha persistente. Splash local removido; permanece apenas a abertura remota original do YouTube. Ícones e Recentes originais preservados."
          fi
