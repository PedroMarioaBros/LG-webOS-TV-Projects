name: Build YouTube UK6530 Recents Icon Fix

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-youtube-recents-iconfix.yml"

permissions:
  actions: read
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact approved 0.8.8 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir restored
          gh run download 36463105907             --repo "$GITHUB_REPOSITORY"             --name youtube-uk6530-lite-v0.3.2             --dir restored
          echo "45d4c7e5f041d2d2f21cae4cb87a42e193fe69033d965a5dd571e3feddf9ff00  restored/YouTube-UK6530-Lite-v0.3.2.ipk" | sha256sum -c -

      - name: Patch only Recents metadata and asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work/data work/control output
          cd work
          ar x ../restored/YouTube-UK6530-Lite-v0.3.2.ipk
          tar -xzf data.tar.gz -C data
          tar -xzf control.tar.gz -C control

          APPDIR="data/usr/palm/applications/youtube.leanback.v4"

          gh api repos/webosbrew/youtube-webos/git/blobs/e8d63479c98115bc54a1adcdebb5a8a2161cc8bd             --jq .content | tr -d '\n' | base64 -d > "$APPDIR/imageForRecents.png"

          python3 - <<'PY'
          import json
          from pathlib import Path

          app = Path("data/usr/palm/applications/youtube.leanback.v4/appinfo.json")
          obj = json.loads(app.read_text(encoding="utf-8"))
          obj["version"] = "0.8.10"
          obj["imageForRecents"] = "imageForRecents.png"
          app.write_text(json.dumps(obj, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          ctrl = Path("control/control")
          text = ctrl.read_text(encoding="utf-8")
          text = text.replace("Version: 0.8.8", "Version: 0.8.10", 1)
          ctrl.write_text(text, encoding="utf-8")

          png = Path("data/usr/palm/applications/youtube.leanback.v4/imageForRecents.png").read_bytes()
          assert png[:8] == b"\x89PNG\r\n\x1a\n"
          width = int.from_bytes(png[16:20], "big")
          height = int.from_bytes(png[20:24], "big")
          assert (width, height) == (1920, 1080), (width, height)

          check = json.loads(app.read_text(encoding="utf-8"))
          assert check["imageForRecents"] == "imageForRecents.png"
          assert check["version"] == "0.8.10"
          PY

          rm data.tar.gz control.tar.gz
          tar -czf data.tar.gz -C data .
          tar -czf control.tar.gz -C control .
          ar r ../output/YouTube-UK6530-Lite-v0.8.10-RecentsFix.ipk debian-binary control.tar.gz data.tar.gz

      - name: Verify package
        run: |
          set -euo pipefail
          sha256sum output/YouTube-UK6530-Lite-v0.8.10-RecentsFix.ipk | tee output/SHA256SUMS.txt
          rm -rf verify && mkdir verify
          cd verify
          ar x ../output/YouTube-UK6530-Lite-v0.8.10-RecentsFix.ipk
          mkdir data && tar -xzf data.tar.gz -C data
          grep -F '"version": "0.8.10"' data/usr/palm/applications/youtube.leanback.v4/appinfo.json
          grep -F '"imageForRecents": "imageForRecents.png"' data/usr/palm/applications/youtube.leanback.v4/appinfo.json
          test -f data/usr/palm/applications/youtube.leanback.v4/imageForRecents.png

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="youtube-uk6530-v0.3.2-recentsfix"
          IPK="output/YouTube-UK6530-Lite-v0.8.10-RecentsFix.ipk"
          SUMS="output/SHA256SUMS.txt"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPK" "$SUMS" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$IPK" "$SUMS"               --repo "$GITHUB_REPOSITORY"               --target "$GITHUB_SHA"               --title "YouTube UK6530 0.8.10 - Recents icon fix"               --prerelease               --notes "Base binária exata da 0.8.8 aprovada. Únicas mudanças: versão 0.8.10, inclusão de imageForRecents.png e propriedade imageForRecents no appinfo.json. Nenhum JS/CSS/runtime alterado."
          fi
