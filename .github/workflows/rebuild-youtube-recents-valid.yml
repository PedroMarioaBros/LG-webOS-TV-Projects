name: Rebuild YouTube UK6530 Recents Fix Correctly

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/rebuild-youtube-recents-valid.yml"

permissions:
  actions: read
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact approved 0.8.8 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir restored
          gh run download 36463105907             --repo "$GITHUB_REPOSITORY"             --name youtube-uk6530-lite-v0.3.2             --dir restored
          echo "45d4c7e5f041d2d2f21cae4cb87a42e193fe69033d965a5dd571e3feddf9ff00  restored/YouTube-UK6530-Lite-v0.3.2.ipk" | sha256sum -c -

      - name: Extract exact application payload
        run: |
          set -euo pipefail
          mkdir raw app
          cd raw
          ar x ../restored/YouTube-UK6530-Lite-v0.3.2.ipk
          tar -xzf data.tar.gz
          cp -a usr/palm/applications/youtube.leanback.v4/. ../app/

      - name: Add only Recents asset and metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh api repos/webosbrew/youtube-webos/git/blobs/e8d63479c98115bc54a1adcdebb5a8a2161cc8bd             --jq .content | tr -d '\n' | base64 -d > app/imageForRecents.png

          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("app/appinfo.json")
          obj = json.loads(p.read_text(encoding="utf-8"))
          obj["version"] = "0.8.10"
          obj["imageForRecents"] = "imageForRecents.png"
          p.write_text(json.dumps(obj, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          png = Path("app/imageForRecents.png").read_bytes()
          assert png[:8] == b"\x89PNG\r\n\x1a\n"
          assert int.from_bytes(png[16:20], "big") == 1920
          assert int.from_bytes(png[20:24], "big") == 1080

          chk = json.loads(p.read_text(encoding="utf-8"))
          assert chk["id"] == "youtube.leanback.v4"
          assert chk["version"] == "0.8.10"
          assert chk["imageForRecents"] == "imageForRecents.png"
          PY

      - name: Package with official webOS CLI
        run: |
          set -euo pipefail
          npm install -g @webos-tools/cli@3.2.6
          mkdir output
          ares-package app -o output
          IPK="$(find output -maxdepth 1 -type f -name 'youtube.leanback.v4_0.8.10*.ipk' | head -n 1)"
          test -n "$IPK"
          mv "$IPK" output/YouTube-UK6530-Lite-v0.8.10-RecentsFix.ipk

      - name: Verify package structure
        run: |
          set -euo pipefail
          file output/YouTube-UK6530-Lite-v0.8.10-RecentsFix.ipk
          ar t output/YouTube-UK6530-Lite-v0.8.10-RecentsFix.ipk | grep -Fx debian-binary
          ar t output/YouTube-UK6530-Lite-v0.8.10-RecentsFix.ipk | grep -Fx control.tar.gz
          ar t output/YouTube-UK6530-Lite-v0.8.10-RecentsFix.ipk | grep -Fx data.tar.gz

          rm -rf verify && mkdir verify
          cd verify
          ar x ../output/YouTube-UK6530-Lite-v0.8.10-RecentsFix.ipk
          mkdir data
          tar -xzf data.tar.gz -C data
          test -f data/usr/palm/applications/youtube.leanback.v4/imageForRecents.png
          grep -F '"version": "0.8.10"' data/usr/palm/applications/youtube.leanback.v4/appinfo.json
          grep -F '"imageForRecents": "imageForRecents.png"' data/usr/palm/applications/youtube.leanback.v4/appinfo.json

      - name: Publish corrected release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha256sum output/YouTube-UK6530-Lite-v0.8.10-RecentsFix.ipk | tee output/SHA256SUMS.txt
          gh release upload youtube-uk6530-v0.3.2-recentsfix             output/YouTube-UK6530-Lite-v0.8.10-RecentsFix.ipk             output/SHA256SUMS.txt             --clobber             --repo "$GITHUB_REPOSITORY"
