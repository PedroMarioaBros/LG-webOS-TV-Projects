name: Restore YouTube UK6530 0.8.19 as 0.9.3

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/restore-youtube-0819-as-093.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download exact 0.8.19 package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p downloads
          gh release download youtube-uk6530-v0.3.9             --repo "$GITHUB_REPOSITORY"             --pattern 'YouTube-UK6530-Lite-v0.8.19.ipk'             --dir downloads
          echo "f9c9073e3b9dadfb75884c316b8fff4274788859ced8d9895d446bce0ab63cd3  downloads/YouTube-UK6530-Lite-v0.8.19.ipk" | sha256sum -c -

      - name: Extract exact 0.8.19 app
        run: |
          set -euo pipefail
          mkdir -p old new
          (
            cd old
            ar x ../downloads/YouTube-UK6530-Lite-v0.8.19.ipk
            mkdir data
            tar -xzf data.tar.gz -C data
          )
          cp -a old/data/usr/palm/applications/youtube.leanback.v4/. new/

      - name: Bump only version to 0.9.3
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("new/appinfo.json")
          obj=json.loads(p.read_text(encoding="utf-8"))
          assert obj["id"]=="youtube.leanback.v4"
          assert obj["version"]=="0.8.19"
          obj["version"]="0.9.3"
          p.write_text(json.dumps(obj,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Prove only appinfo version changed
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          OLD=Path("old/data/usr/palm/applications/youtube.leanback.v4")
          NEW=Path("new")

          def sha(p):
              h=hashlib.sha256()
              h.update(p.read_bytes())
              return h.hexdigest()

          old={p.relative_to(OLD).as_posix():p for p in OLD.rglob("*") if p.is_file()}
          new={p.relative_to(NEW).as_posix():p for p in NEW.rglob("*") if p.is_file()}
          assert set(old)==set(new)

          changed=[rel for rel,p in old.items() if sha(p)!=sha(new[rel])]
          assert changed==["appinfo.json"], changed

          a=json.loads((OLD/"appinfo.json").read_text())
          b=json.loads((NEW/"appinfo.json").read_text())
          a["version"]=b["version"]
          assert a==b, "appinfo changed beyond version"

          print("Exact 0.8.19 restored; only version changed to 0.9.3.")
          PY

      - name: Package with official webOS CLI
        run: |
          set -euo pipefail
          npm install -g @webos-tools/cli@3.2.6
          mkdir -p output
          ares-package --no-minify new -o output
          IPK="$(find output -maxdepth 1 -type f -name 'youtube.leanback.v4_0.9.3*.ipk' | head -n 1)"
          test -n "$IPK"
          mv "$IPK" output/YouTube-UK6530-Restore-0819-v0.9.3.ipk
          sha256sum output/YouTube-UK6530-Restore-0819-v0.9.3.ipk | tee output/SHA256SUMS.txt

      - name: Verify final package identity
        run: |
          set -euo pipefail
          mkdir -p verify
          (
            cd verify
            ar x ../output/YouTube-UK6530-Restore-0819-v0.9.3.ipk
            mkdir data
            tar -xzf data.tar.gz -C data
          )
          APP="verify/data/usr/palm/applications/youtube.leanback.v4"
          grep -F '"id": "youtube.leanback.v4"' "$APP/appinfo.json"
          grep -F '"version": "0.9.3"' "$APP/appinfo.json"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="youtube-uk6530-restore-0819-v0.9.3"
          IPK="output/YouTube-UK6530-Restore-0819-v0.9.3.ipk"
          SUMS="output/SHA256SUMS.txt"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPK" "$SUMS" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$IPK" "$SUMS"               --repo "$GITHUB_REPOSITORY"               --target "$GITHUB_SHA"               --title "YouTube UK6530 Restore 0.8.19 as 0.9.3"               --prerelease               --notes "Restauração exata da versão 0.8.19 que o usuário aprovou para uso atual. Única alteração: número da versão para 0.9.3, permitindo atualização in-place sobre 0.9.2/0.9.0 sem desinstalar."
          fi
