name: Build YouTube UK6530 0.8.20 Minimal

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-youtube-0820-minimal.yml"

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout PMCN project
        uses: actions/checkout@v4
        with:
          path: project

      - name: Checkout clean pinned upstream
        uses: actions/checkout@v4
        with:
          repository: NicholasBly/youtube-webos
          ref: 5f7aa18fa0829b4e0607475222d5adacd85c6eff
          path: upstream

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: upstream/package-lock.json

      - name: Restore exact working launcher and Recents assets from 0.8.19
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p previous previous_extract
          gh release download youtube-uk6530-v0.3.9             --repo "$GITHUB_REPOSITORY"             --pattern 'YouTube-UK6530-Lite-v0.8.19.ipk'             --dir previous
          (
            cd previous_extract
            ar x ../previous/YouTube-UK6530-Lite-v0.8.19.ipk
            mkdir data
            tar -xzf data.tar.gz -C data
          )
          OLD="previous_extract/data/usr/palm/applications/youtube.leanback.v4"
          cp "$OLD/icon_youtube_original_0814.png" upstream/assets/icon_youtube_original_0814.png
          cp "$OLD/largeIcon_youtube_original_0814.png" upstream/assets/largeIcon_youtube_original_0814.png
          cp "$OLD/imageForRecents_youtube_original_0814.png" upstream/assets/imageForRecents_youtube_original_0814.png

      - name: Apply minimal YouTube + AdBlock + sidebar patch
        working-directory: upstream
        run: python3 ../project/youtube-uk6530-optimized/tools/apply_uk6530_minimal_0820.py

      - name: Verify clean source scope
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail

          # Required behavior.
          grep -F "enableAdBlock: true" src/config.js
          grep -F "PMCN_BLOCKED_NAV_BROWSE_IDS" src/adblock.js
          grep -F "'FEshorts', 'FEshorts_tv'" src/adblock.js
          grep -F "import './pmcn-menu-filter.js';" src/userScript.js

          # Thumbnail/card experiments must not be in runtime entry points.
          ! grep -F "pmcn-thumbnail-quality" src/userScript.js
          ! grep -F "pmcn-card-sync" src/userScript.js
          ! grep -F "upgradeResponseThumbnails" src/adblock.js
          ! grep -F "thumbnailHookRequired" src/adblock.js
          ! grep -F "force-codec.js" src/userScript.js
          ! grep -F "yt-fixes.css" src/userScript.js
          ! grep -F "sponsorblock.js" src/userScript.js
          ! grep -F "watch.js" src/userScript.js

          # All content-removal / image / playback overrides remain disabled.
          grep -F "upgradeThumbnails: false" src/config.js
          grep -F "removeGlobalShorts: false" src/config.js
          grep -F "removeLiveVideos: false" src/config.js
          grep -F "removeTopLiveGames: false" src/config.js
          grep -F "removeMostRelevant: false" src/config.js
          grep -F "hideEndcards: false" src/config.js
          grep -F "forceHighResVideo: false" src/config.js
          grep -F "forceVideoCodec: 'auto'" src/config.js
          grep -F "forcePreviews: 'disabled'" src/config.js

          grep -F '"version": "0.8.20"' assets/appinfo.json
          grep -F '"icon": "icon_youtube_original_0814.png"' assets/appinfo.json
          grep -F '"largeIcon": "largeIcon_youtube_original_0814.png"' assets/appinfo.json
          grep -F '"imageForRecents": "imageForRecents_youtube_original_0814.png"' assets/appinfo.json
          ! grep -F '"splashBackground"' assets/appinfo.json

      - name: Install dependencies
        working-directory: upstream
        run: npm ci

      - name: Build package
        working-directory: upstream
        run: |
          npm run build
          npm run package

      - name: Verify compiled runtime has no thumbnail/card intervention
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="$(find dist -type f -path '*/webOSUserScripts/userScript.js' | head -n 1)"
          test -n "$BUNDLE"

          ! grep -F "pmcn-thumbnail-quality" "$BUNDLE"
          ! grep -F "pmcn-card-sync" "$BUNDLE"
          ! grep -F "ytaf-thumb-quality" "$BUNDLE"
          ! grep -F "pmcn-subscriptions-card-width" "$BUNDLE"
          ! grep -F "Max Thumbnail Quality" "$BUNDLE"
          ! grep -F "thumbnailQualityMode" "$BUNDLE"

          # The two intended interventions are present.
          grep -F "PMCN_BLOCKED_NAV_BROWSE_IDS" "$BUNDLE"
          grep -F "FEgaming_destination" "$BUNDLE"

      - name: Prepare release file
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          IPK="$(find upstream/dist -maxdepth 1 -type f -name 'youtube.leanback.v4_0.8.20*.ipk' | head -n 1)"
          test -n "$IPK"
          cp "$IPK" output/YouTube-UK6530-Minimal-v0.8.20.ipk
          sha256sum output/YouTube-UK6530-Minimal-v0.8.20.ipk | tee output/SHA256SUMS.txt

      - name: Prove launcher and Recents stayed byte-identical to 0.8.19
        shell: bash
        run: |
          set -euo pipefail
          rm -rf new_extract
          mkdir new_extract
          (
            cd new_extract
            ar x ../output/YouTube-UK6530-Minimal-v0.8.20.ipk
            mkdir data
            tar -xzf data.tar.gz -C data
          )
          OLD="previous_extract/data/usr/palm/applications/youtube.leanback.v4"
          NEW="new_extract/data/usr/palm/applications/youtube.leanback.v4"

          cmp "$OLD/icon_youtube_original_0814.png" "$NEW/icon_youtube_original_0814.png"
          cmp "$OLD/largeIcon_youtube_original_0814.png" "$NEW/largeIcon_youtube_original_0814.png"
          cmp "$OLD/imageForRecents_youtube_original_0814.png" "$NEW/imageForRecents_youtube_original_0814.png"

          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("new_extract/data/usr/palm/applications/youtube.leanback.v4/appinfo.json")
          obj=json.loads(p.read_text())
          assert obj["id"]=="youtube.leanback.v4"
          assert obj["version"]=="0.8.20"
          assert obj["icon"]=="icon_youtube_original_0814.png"
          assert obj["largeIcon"]=="largeIcon_youtube_original_0814.png"
          assert obj["imageForRecents"]=="imageForRecents_youtube_original_0814.png"
          assert "splashBackground" not in obj
          print("Launcher/Recents preserved; no local splash.")
          PY

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="youtube-uk6530-v0.4.0-minimal"
          IPK="output/YouTube-UK6530-Minimal-v0.8.20.ipk"
          SUMS="output/SHA256SUMS.txt"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPK" "$SUMS" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$IPK" "$SUMS"               --repo "$GITHUB_REPOSITORY"               --target "$GITHUB_SHA"               --title "YouTube UK6530 0.8.20 Minimal"               --prerelease               --notes "Reconstruída a partir do upstream limpo e fixado. Mantém apenas duas intervenções de produto: bloqueio de anúncios do YouTube e remoção estrutural das categorias indesejadas no menu lateral. Removidos do runtime seletor/reescrita/cache de thumbnails, sincronizador de cards, codec forçado, buffer customizado, previews forçados, SponsorBlock, UI customizada, CSS visual customizado e auto-login. Ícones e Recentes preservados byte a byte da 0.8.19; sem splash local."
          fi
