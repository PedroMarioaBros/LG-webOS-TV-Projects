name: Remove bad YouTube UK6530 v0.3.3

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/remove-youtube-v033.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete v0.3.3 release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete youtube-uk6530-v0.3.3 --cleanup-tag --yes --repo "$GITHUB_REPOSITORY"
