name: Build YouTube UK6530 0.8.17

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-youtube-0817.yml"

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout PMCN project
        uses: actions/checkout@v4
        with:
          path: project

      - name: Checkout pinned upstream
        uses: actions/checkout@v4
        with:
          repository: NicholasBly/youtube-webos
          ref: 5f7aa18fa0829b4e0607475222d5adacd85c6eff
          path: upstream

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: upstream/package-lock.json

      - name: Apply approved base and existing fixes
        working-directory: upstream
        run: |
          set -euo pipefail
          python3 ../project/youtube-uk6530-optimized/tools/apply_uk6530_patch.py
          python3 ../project/youtube-uk6530-optimized/tools/apply_uk6530_0814_delta.py
          python3 ../project/youtube-uk6530-optimized/tools/apply_uk6530_0815_delta.py
          python3 ../project/youtube-uk6530-optimized/tools/apply_uk6530_0816_delta.py

      - name: Apply only 0.8.17 watch-text cleanup
        working-directory: upstream
        run: python3 ../project/youtube-uk6530-optimized/tools/apply_uk6530_0817_delta.py

      - name: Recreate exact 0.8.16 launcher and Recents assets
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          cp assets/icon.png assets/icon_youtube_original_0814.png
          cp assets/largeIcon.png assets/largeIcon_youtube_original_0814.png

          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import json
          from collections import deque

          A = Path("assets")
          src = Image.open(A / "largeIcon.png").convert("RGBA")
          p = src.load()
          w,h = src.size

          seen=set(); q=deque()
          def white(x,y):
              r,g,b,a=p[x,y]
              return a>0 and r>=225 and g>=225 and b>=225

          for x in range(w):
              for y in (0,h-1):
                  if white(x,y):
                      q.append((x,y)); seen.add((x,y))
          for y in range(h):
              for x in (0,w-1):
                  if white(x,y) and (x,y) not in seen:
                      q.append((x,y)); seen.add((x,y))

          while q:
              x,y=q.popleft()
              for nx,ny in ((x-1,y),(x+1,y),(x,y-1),(x,y+1)):
                  if 0<=nx<w and 0<=ny<h and (nx,ny) not in seen and white(nx,ny):
                      seen.add((nx,ny)); q.append((nx,ny))

          logo=src.copy(); lp=logo.load()
          for x,y in seen:
              r,g,b,a=lp[x,y]; lp[x,y]=(r,g,b,0)
          bbox=logo.getchannel("A").getbbox()
          if not bbox:
              raise RuntimeError("Could not isolate original YouTube logo")
          logo=logo.crop(bbox)

          W,H=1920,1080
          rec=Image.new("RGBA",(W,H),(255,255,255,255))
          rw=1050
          rh=round(logo.height*rw/logo.width)
          logo=logo.resize((rw,rh),Image.Resampling.LANCZOS)
          rec.alpha_composite(logo,((W-rw)//2,(H-rh)//2))
          rec.convert("RGB").save(A/"imageForRecents_youtube_original_0814.png",optimize=True)

          app=A/"appinfo.json"
          obj=json.loads(app.read_text(encoding="utf-8"))
          assert obj["version"]=="0.8.17"
          obj["icon"]="icon_youtube_original_0814.png"
          obj["largeIcon"]="largeIcon_youtube_original_0814.png"
          obj["imageForRecents"]="imageForRecents_youtube_original_0814.png"
          obj.pop("splashBackground",None)
          app.write_text(json.dumps(obj,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Verify narrow CSS scope
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          grep -F "PMCN UK6530 0.8.17 — Watch text background cleanup." src/yt-fixes.css
          grep -F "yt-formatted-string.XGffTd.WVWtef" src/yt-fixes.css
          grep -F "span[idomkey^='detail-text-']" src/yt-fixes.css
          grep -F "span.g6XRz" src/yt-fixes.css
          grep -F "span.V7jTHe" src/yt-fixes.css
          grep -F "yt-formatted-string.XGffTd.dxLAmd" src/yt-fixes.css
          grep -F "span.KzcwEe.h14Bce" src/yt-fixes.css
          grep -F "UK6530_BLOCKED_NAV_BROWSE_IDS" src/adblock.js
          grep -F "PMCN_QUALITY_STORAGE_KEY" src/thumbnail-quality.js
          grep -F '"version": "0.8.17"' assets/appinfo.json

      - name: Install dependencies
        working-directory: upstream
        run: npm ci

      - name: Build package
        working-directory: upstream
        run: |
          npm run build
          npm run package

      - name: Prepare release file
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          IPK="$(find upstream/dist -maxdepth 1 -type f -name 'youtube.leanback.v4_0.8.17*.ipk' | head -n 1)"
          test -n "$IPK"
          cp "$IPK" output/YouTube-UK6530-Lite-v0.8.17.ipk
          sha256sum output/YouTube-UK6530-Lite-v0.8.17.ipk | tee output/SHA256SUMS.txt

      - name: Prove 0.8.17 changed only bundle and version metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p baseline oldpkg newpkg
          gh release download youtube-uk6530-v0.3.6             --repo "$GITHUB_REPOSITORY"             --pattern 'YouTube-UK6530-Lite-v0.8.16.ipk'             --dir baseline

          (
            cd oldpkg
            ar x ../baseline/YouTube-UK6530-Lite-v0.8.16.ipk
            mkdir data
            tar -xzf data.tar.gz -C data
          )
          (
            cd newpkg
            ar x ../output/YouTube-UK6530-Lite-v0.8.17.ipk
            mkdir data
            tar -xzf data.tar.gz -C data
          )

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          OLD=Path("oldpkg/data/usr/palm/applications/youtube.leanback.v4")
          NEW=Path("newpkg/data/usr/palm/applications/youtube.leanback.v4")
          allowed={"webOSUserScripts/userScript.js","appinfo.json"}

          def sha(p):
              h=hashlib.sha256(); h.update(p.read_bytes()); return h.hexdigest()

          old={p.relative_to(OLD).as_posix():p for p in OLD.rglob("*") if p.is_file()}
          new={p.relative_to(NEW).as_posix():p for p in NEW.rglob("*") if p.is_file()}

          assert set(old)==set(new), (set(old)-set(new), set(new)-set(old))
          changed=[]
          for rel,p in old.items():
              if sha(p)!=sha(new[rel]):
                  changed.append(rel)
          assert set(changed)==allowed, f"Unexpected changed payload files: {changed}"

          a=json.loads((OLD/"appinfo.json").read_text())
          b=json.loads((NEW/"appinfo.json").read_text())
          a["version"]=b["version"]
          assert a==b, "appinfo changed beyond version"

          print("Changed payload files only:", sorted(changed))
          print("All icons, Recents, menu-support files and other assets are byte-identical to 0.8.16.")
          PY

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="youtube-uk6530-v0.3.7"
          IPK="output/YouTube-UK6530-Lite-v0.8.17.ipk"
          SUMS="output/SHA256SUMS.txt"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPK" "$SUMS" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$IPK" "$SUMS"               --repo "$GITHUB_REPOSITORY"               --target "$GITHUB_SHA"               --title "YouTube UK6530 0.8.17"               --prerelease               --notes "Mudança cirúrgica sobre a 0.8.16: remove apenas fundos opacos atrás de título, metadados, timecodes e textos da bandeja de recomendações na tela de reprodução, preservando sombra de texto para legibilidade. Menus, seletor de capas, ícones, Recentes, layout e player preservados."
          fi
