name: Build YouTube UK6530 Recovery 0.9.2

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-youtube-recovery-092.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download exact stable 0.8.20 package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p downloads
          gh release download youtube-uk6530-v0.4.0-minimal             --repo "$GITHUB_REPOSITORY"             --pattern 'YouTube-UK6530-Minimal-v0.8.20.ipk'             --dir downloads
          echo "5eae156f78875230e7bcdaf32f34fd0dfc1379911e7a81085a40ab5498dff2e1  downloads/YouTube-UK6530-Minimal-v0.8.20.ipk" | sha256sum -c -

      - name: Extract exact stable app
        run: |
          set -euo pipefail
          mkdir -p old new
          (
            cd old
            ar x ../downloads/YouTube-UK6530-Minimal-v0.8.20.ipk
            mkdir data
            tar -xzf data.tar.gz -C data
          )
          cp -a old/data/usr/palm/applications/youtube.leanback.v4/. new/

      - name: Bump only version
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("new/appinfo.json")
          obj=json.loads(p.read_text(encoding="utf-8"))
          assert obj["id"]=="youtube.leanback.v4"
          assert obj["version"]=="0.8.20"
          obj["version"]="0.9.2"
          p.write_text(json.dumps(obj,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Prove only appinfo changed
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          OLD=Path("old/data/usr/palm/applications/youtube.leanback.v4")
          NEW=Path("new")

          def sha(p):
              h=hashlib.sha256(); h.update(p.read_bytes()); return h.hexdigest()

          old={p.relative_to(OLD).as_posix():p for p in OLD.rglob("*") if p.is_file()}
          new={p.relative_to(NEW).as_posix():p for p in NEW.rglob("*") if p.is_file()}
          assert set(old)==set(new)

          changed=[rel for rel,p in old.items() if sha(p)!=sha(new[rel])]
          assert changed==["appinfo.json"], changed

          a=json.loads((OLD/"appinfo.json").read_text())
          b=json.loads((NEW/"appinfo.json").read_text())
          a["version"]=b["version"]
          assert a==b
          print("Recovery package is byte-identical to 0.8.20 except appinfo version.")
          PY

      - name: Package with official webOS CLI
        run: |
          set -euo pipefail
          npm install -g @webos-tools/cli@3.2.6
          mkdir -p output
          ares-package --no-minify new -o output
          IPK="$(find output -maxdepth 1 -type f -name 'youtube.leanback.v4_0.9.2*.ipk' | head -n 1)"
          test -n "$IPK"
          mv "$IPK" output/YouTube-UK6530-Recovery-v0.9.2.ipk
          sha256sum output/YouTube-UK6530-Recovery-v0.9.2.ipk | tee output/SHA256SUMS.txt

      - name: Publish recovery release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="youtube-uk6530-recovery-v0.9.2"
          IPK="output/YouTube-UK6530-Recovery-v0.9.2.ipk"
          SUMS="output/SHA256SUMS.txt"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPK" "$SUMS" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$IPK" "$SUMS"               --repo "$GITHUB_REPOSITORY"               --target "$GITHUB_SHA"               --title "YouTube UK6530 Recovery 0.9.2"               --prerelease               --notes "Pacote de recuperação: conteúdo exato da versão funcional 0.8.20, com única alteração sendo o número de versão para 0.9.2, permitindo atualização in-place sobre a Cobalt 0.9.0 que não abre."
          fi
