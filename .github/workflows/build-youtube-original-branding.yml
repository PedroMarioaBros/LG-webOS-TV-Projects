name: Build YouTube UK6530 Original Branding

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-youtube-original-branding.yml"

permissions:
  actions: read
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact approved 0.8.8 base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir restored
          gh run download 36463105907             --repo "$GITHUB_REPOSITORY"             --name youtube-uk6530-lite-v0.3.2             --dir restored
          echo "45d4c7e5f041d2d2f21cae4cb87a42e193fe69033d965a5dd571e3feddf9ff00  restored/YouTube-UK6530-Lite-v0.3.2.ipk" | sha256sum -c -

      - name: Extract exact application
        run: |
          set -euo pipefail
          mkdir raw app app_orig
          cd raw
          ar x ../restored/YouTube-UK6530-Lite-v0.3.2.ipk
          tar -xzf data.tar.gz
          cp -a usr/palm/applications/youtube.leanback.v4/. ../app/
          cp -a usr/palm/applications/youtube.leanback.v4/. ../app_orig/

      - name: Add only original YouTube Recents artwork
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow

          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import json

          APP = Path("app")

          # Use the exact original YouTube largeIcon.png from the approved 0.8.8.
          src = Image.open(APP / "largeIcon.png").convert("RGBA")
          pix = src.load()
          xs, ys = [], []
          for y in range(src.height):
              for x in range(src.width):
                  r,g,b,a = pix[x,y]
                  if a > 0 and not (r > 245 and g > 245 and b > 245):
                      xs.append(x); ys.append(y)
          if not xs:
              raise RuntimeError("Could not detect original YouTube logo content")
          box = (min(xs), min(ys), max(xs)+1, max(ys)+1)
          logo = src.crop(box)

          W, H = 1920, 1080
          canvas = Image.new("RGBA", (W, H), (255,255,255,255))
          target_w = 1050
          target_h = round(logo.height * target_w / logo.width)
          logo = logo.resize((target_w, target_h), Image.Resampling.LANCZOS)
          x = (W - target_w)//2
          y = (H - target_h)//2
          canvas.alpha_composite(logo, (x,y))
          canvas.convert("RGB").save(APP / "imageForRecents.png", optimize=True)

          appinfo = APP / "appinfo.json"
          obj = json.loads(appinfo.read_text(encoding="utf-8"))
          obj["version"] = "0.8.12"
          obj["imageForRecents"] = "imageForRecents.png"
          appinfo.write_text(json.dumps(obj, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          assert Image.open(APP / "imageForRecents.png").size == (1920,1080)
          assert obj["id"] == "youtube.leanback.v4"
          assert obj["version"] == "0.8.12"
          assert obj["imageForRecents"] == "imageForRecents.png"
          PY

      - name: Prove original icons, splash and runtime are untouched
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          OLD = Path("app_orig")
          NEW = Path("app")
          allowed = {"appinfo.json", "imageForRecents.png"}

          def digest(p):
              h=hashlib.sha256()
              h.update(p.read_bytes())
              return h.hexdigest()

          old_files={p.relative_to(OLD).as_posix():p for p in OLD.rglob("*") if p.is_file()}
          new_files={p.relative_to(NEW).as_posix():p for p in NEW.rglob("*") if p.is_file()}

          for rel,p in old_files.items():
              if rel in allowed:
                  continue
              assert rel in new_files, f"Missing original file: {rel}"
              assert digest(p)==digest(new_files[rel]), f"Unexpected modification: {rel}"

          assert set(new_files)-set(old_files) == {"imageForRecents.png"}

          # Explicitly prove the files the user asked to restore are byte-identical to 0.8.8.
          for rel in [
              "icon.png",
              "largeIcon.png",
              "9262051282473701_youtube_leanback_preview.png",
              "9262051307371701_youtube_leanback_splash.png",
          ]:
              assert digest(OLD/rel)==digest(NEW/rel), rel

          print("Approved 0.8.8 runtime, vertical icons and launch artwork preserved byte-for-byte.")
          PY

      - name: Package with official webOS CLI
        run: |
          set -euo pipefail
          npm install -g @webos-tools/cli@3.2.6
          mkdir output
          ares-package app -o output
          IPK="$(find output -maxdepth 1 -type f -name 'youtube.leanback.v4_0.8.12*.ipk' | head -n 1)"
          test -n "$IPK"
          mv "$IPK" output/YouTube-UK6530-Lite-v0.8.12-OriginalBranding.ipk

      - name: Verify final package
        run: |
          set -euo pipefail
          rm -rf verify && mkdir verify
          cd verify
          ar x ../output/YouTube-UK6530-Lite-v0.8.12-OriginalBranding.ipk
          mkdir data
          tar -xzf data.tar.gz -C data
          APP="data/usr/palm/applications/youtube.leanback.v4"
          grep -F '"version": "0.8.12"' "$APP/appinfo.json"
          grep -F '"imageForRecents": "imageForRecents.png"' "$APP/appinfo.json"
          test -f "$APP/icon.png"
          test -f "$APP/largeIcon.png"
          test -f "$APP/9262051307371701_youtube_leanback_splash.png"
          test -f "$APP/imageForRecents.png"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha256sum output/YouTube-UK6530-Lite-v0.8.12-OriginalBranding.ipk | tee output/SHA256SUMS.txt
          TAG="youtube-uk6530-v0.3.2-original-branding"
          IPK="output/YouTube-UK6530-Lite-v0.8.12-OriginalBranding.ipk"
          SUMS="output/SHA256SUMS.txt"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPK" "$SUMS" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$IPK" "$SUMS"               --repo "$GITHUB_REPOSITORY"               --target "$GITHUB_SHA"               --title "YouTube UK6530 0.8.12 - Original YouTube Branding"               --prerelease               --notes "Base binária exata da 0.8.8 aprovada. Ícones verticais, splash e preview permanecem byte-idênticos à 0.8.8. Única correção visual nova: imageForRecents com o logo original do YouTube derivado do largeIcon original da própria 0.8.8. Nenhum JS/CSS/runtime alterado."
          fi
