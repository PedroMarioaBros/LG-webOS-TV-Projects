name: Build YouTube UK6530 Cobalt Minimal 2.0.6
# native Cobalt 2.0.5 base + PMCN minimal adblock/sidebar layer

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-youtube-cobalt-minimal-206.yml"

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Download Cobalt AdFree runtime package
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -o /tmp/cobalt.ipk \
            https://github.com/RF1705/youtube-webos-cobalt-adfree/releases/download/v2.0.5-beta/youtube.leanback.v4_2.0.5_arm.ipk
          echo "1eb0453a3ffa2fe5045471f466d121ff0e4482cf797eaccdf3f259e67f7a0971  /tmp/cobalt.ipk" | sha256sum -c -

      - name: Extract and locate Cobalt app
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cobalt-unpack /tmp/cobalt-data
          mkdir -p /tmp/cobalt-unpack /tmp/cobalt-data
          (
            cd /tmp/cobalt-unpack
            ar x /tmp/cobalt.ipk
          )
          tar -xzf /tmp/cobalt-unpack/data.tar.gz -C /tmp/cobalt-data

          echo "=== top extracted tree ==="
          find /tmp/cobalt-data -maxdepth 7 -printf '%y %p\n' | head -n 250 || true
          echo "=== appinfo candidates ==="
          find /tmp/cobalt-data -name appinfo.json -print || true
          echo "=== cobalt candidates ==="
          find /tmp/cobalt-data \( -name cobalt -o -name libcobalt.so \) -print || true
          echo "=== adblock directories ==="
          find /tmp/cobalt-data -type d -path '*adblock*' -print || true

          APP="$(dirname "$(find /tmp/cobalt-data -name appinfo.json -path '*youtube.leanback.v4*' -print -quit)")"
          test -n "$APP"
          echo "Resolved APP=$APP"
          test -f "$APP/appinfo.json"

          COBALT="$(find "$APP" -type f -name cobalt -print -quit)"
          test -n "$COBALT"
          echo "$COBALT" > /tmp/cobalt-path.txt
          echo "Resolved COBALT=$COBALT"
          sha256sum "$COBALT" > /tmp/original-cobalt.sha256
          strings "$COBALT" | grep -F "/web/adblock/adblockPreload.js"
          strings "$COBALT" | grep -F "file:///adblock/adblockMain.js"

          echo "=== candidate content/web directories ==="
          find "$APP" -maxdepth 8 -type d \( -name adblock -o -name web -o -name content \) -print || true
          echo "=== candidate injected assets ==="
          find "$APP" -type f \( -name 'adblockMain.js' -o -name 'adblockPreload.js' -o -name 'adblockMain.css' \) -print || true

          AD="$(find "$APP" -type d -name adblock -print -quit)"
          if [ -z "$AD" ]; then
            AD="$APP/content/web/adblock"
            mkdir -p "$AD"
          fi
          echo "$AD" > /tmp/adblock-path.txt
          echo "Resolved AD=$AD"
          find "$AD" -maxdepth 1 -type f -printf '%f\n' | sort || true

          echo "=== early preload hook references ==="
          grep -aRl '/web/adblock/adblockPreload.js' "$APP" || true
          grep -aRl 'adblockPreload.js' "$APP" || true

      - name: Replace all injected extras with PMCN minimal layer
        shell: bash
        run: |
          set -euo pipefail
          APP=/tmp/cobalt-data/usr/palm/applications/youtube.leanback.v4
          AD="$(cat /tmp/adblock-path.txt)"

          rm -rf "$AD"
          mkdir -p "$AD"
          cp youtube-uk6530-cobalt-minimal/adblockPreload.js "$AD/adblockPreload.js"
          cp youtube-uk6530-cobalt-minimal/adblockMain.js "$AD/adblockMain.js"
          cp youtube-uk6530-cobalt-minimal/adblockMain.css "$AD/adblockMain.css"

          test "$(find "$AD" -maxdepth 1 -type f | wc -l)" -eq 3
          test -s "$AD/adblockPreload.js"
          test -s "$AD/adblockMain.js"
          test -s "$AD/adblockMain.css"

      - name: Preserve current approved launcher and Recents artwork
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/current /tmp/current-unpack /tmp/current-data
          gh release download youtube-uk6530-v0.4.0-minimal             --repo "$GITHUB_REPOSITORY"             --pattern 'YouTube-UK6530-Minimal-v0.8.20.ipk'             --dir /tmp/current
          (
            cd /tmp/current-unpack
            ar x /tmp/current/YouTube-UK6530-Minimal-v0.8.20.ipk
          )
          tar -xzf /tmp/current-unpack/data.tar.gz -C /tmp/current-data

          OLD=/tmp/current-data/usr/palm/applications/youtube.leanback.v4
          APP=/tmp/cobalt-data/usr/palm/applications/youtube.leanback.v4

          cp "$OLD/icon_youtube_original_0814.png" "$APP/icon_youtube_original_0814.png"
          cp "$OLD/largeIcon_youtube_original_0814.png" "$APP/largeIcon_youtube_original_0814.png"
          cp "$OLD/imageForRecents_youtube_original_0814.png" "$APP/imageForRecents_youtube_original_0814.png"

      - name: Set PMCN metadata without touching Cobalt runtime
        shell: bash
        run: |
          set -euo pipefail
          APP=/tmp/cobalt-data/usr/palm/applications/youtube.leanback.v4
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=next(Path("/tmp/cobalt-data").rglob("appinfo.json"))
          o=json.loads(p.read_text())
          assert o["id"]=="youtube.leanback.v4"
          assert o["type"]=="native"
          assert o["main"]=="cobalt"
          o["version"]="2.0.6"
          o["title"]="YouTube UK6530"
          o["vendor"]="PMCN / Cobalt"
          o["icon"]="icon_youtube_original_0814.png"
          o["largeIcon"]="largeIcon_youtube_original_0814.png"
          o["imageForRecents"]="imageForRecents_youtube_original_0814.png"
          p.write_text(json.dumps(o,ensure_ascii=False,indent=2)+"\n")
          PY

      - name: Verify minimal behavior and native Cobalt identity
        shell: bash
        run: |
          set -euo pipefail
          APP=/tmp/cobalt-data/usr/palm/applications/youtube.leanback.v4
          AD="$(cat /tmp/adblock-path.txt)"

          grep -F "stripAds" "$AD/adblockPreload.js"
          grep -F "stripBlockedGuideEntries" "$AD/adblockPreload.js"
          grep -F "FEshorts" "$AD/adblockPreload.js"
          grep -F "FEgaming_destination" "$AD/adblockPreload.js"
          grep -F "FEpodcasts_destination" "$AD/adblockPreload.js"
          grep -F "Minimal Cobalt main: no UI/theme/thumbnail hooks loaded" "$AD/adblockMain.js"

          ! grep -R -F "SponsorBlock" "$AD"
          ! grep -R -F "thumbnail" "$AD"
          ! grep -R -F "ReturnYouTubeDislike" "$AD"
          ! grep -R -F "auto-login" "$AD"
          ! grep -R -F "background-color" "$AD"
          ! grep -R -F "text-shadow" "$AD"

          python3 - <<'PY'
          import json
          from pathlib import Path
          p=next(Path("/tmp/cobalt-data").rglob("appinfo.json"))
          o=json.loads(p.read_text())
          assert o["id"]=="youtube.leanback.v4"
          assert o["type"]=="native"
          assert o["main"]=="cobalt"
          assert o["version"]=="2.0.6"
          assert o["icon"]=="icon_youtube_original_0814.png"
          assert o["largeIcon"]=="largeIcon_youtube_original_0814.png"
          assert o["imageForRecents"]=="imageForRecents_youtube_original_0814.png"
          print("Native Cobalt package identity verified.")
          PY

          # Engine itself must be byte-identical to the known Cobalt 1.2.5 release.
          echo "$(cut -d' ' -f1 /tmp/original-cobalt.sha256)  $APP/cobalt" | sha256sum -c -

      - name: Package with official webOS CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @webos-tools/cli@3.2.6
          APP=/tmp/cobalt-data/usr/palm/applications/youtube.leanback.v4
          mkdir -p output
          ares-package -v -c "$APP"
          ares-package -v --outdir output "$APP"

          IPK="$(find output -maxdepth 1 -type f -name 'youtube.leanback.v4_2.0.6*.ipk' | head -n 1)"
          test -n "$IPK"
          cp "$IPK" output/YouTube-UK6530-Cobalt-Minimal-v2.0.6.ipk
          sha256sum output/YouTube-UK6530-Cobalt-Minimal-v2.0.6.ipk | tee output/SHA256SUMS.txt

      - name: Re-open package and verify Cobalt survived byte-identical
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/new-unpack /tmp/new-data
          (
            cd /tmp/new-unpack
            ar x "$GITHUB_WORKSPACE/output/YouTube-UK6530-Cobalt-Minimal-v2.0.6.ipk"
          )
          tar -xzf /tmp/new-unpack/data.tar.gz -C /tmp/new-data
          APP=/tmp/new-data/usr/palm/applications/youtube.leanback.v4
          echo "$(cut -d' ' -f1 /tmp/original-cobalt.sha256)  $APP/cobalt" | sha256sum -c -
          AD="$(find "$APP" -type d -name adblock -print -quit)"
          test -n "$AD"
          test "$(find "$AD" -maxdepth 1 -type f | wc -l)" -eq 3
          test -s "$AD/adblockPreload.js"
          test -s "$AD/adblockMain.js"
          test -s "$AD/adblockMain.css"
          test "$(find "$APP" -type d -name adblock | wc -l)" -eq 1
          ! grep -R -F "SponsorBlock" "$AD"
          ! grep -R -F "thumbnail-quality" "$AD"

      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="youtube-uk6530-v2.0.6-cobalt-minimal"
          IPK="output/YouTube-UK6530-Cobalt-Minimal-v2.0.6.ipk"
          SUMS="output/SHA256SUMS.txt"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPK" "$SUMS" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$IPK" "$SUMS"               --repo "$GITHUB_REPOSITORY"               --target "$GITHUB_SHA"               --title "YouTube UK6530 2.0.6 Cobalt Minimal"               --prerelease               --notes "Mudança de arquitetura: base nativa Cobalt em vez do wrapper WebKit. A camada injetada contém somente bloqueio de anúncios do YouTube e filtro estrutural/fallback do menu lateral. Sem SponsorBlock, RYD, menu de configuração, seletor de capas, CSS visual, alterações de texto, codec, player ou layout. Ícones e Recentes preservados da 0.8.20."
          fi
